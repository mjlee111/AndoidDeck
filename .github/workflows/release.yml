# Builds a signed APK, standalone server executables for Windows/macOS/Linux and a source zip
# for a version tag (v1.2.3), and attaches them to a DRAFT GitHub release. A maintainer reviews
# the draft and publishes it by hand.
#
# Repository secrets for a stable signing key (without them the APK uses a throwaway debug key,
# and phones cannot update in place between releases):
#   ANDROIDDECK_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROIDDECK_KEYSTORE_PASSWORD
#   ANDROIDDECK_KEY_ALIAS
#   ANDROIDDECK_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version
        id: v
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          v="${RAW_VERSION#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW_VERSION' is not a version like 1.2.3"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  server-binaries:
    name: Server executable · ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: server
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python packaging/build.py --version "$VERSION"

      - name: Package
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          mkdir -p out
          case "$RUNNER_OS_NAME" in
            Windows) cp dist/AndroidDeckServer.exe "out/AndroidDeckServer-$VERSION-windows.exe" ;;
            macOS) cp dist/AndroidDeck-Server-macos.zip "out/AndroidDeckServer-$VERSION-macos.zip" ;;
            *) tar -czf "out/AndroidDeckServer-$VERSION-linux-x64.tar.gz" -C dist AndroidDeckServer ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ runner.os }}
          path: server/out/*
          if-no-files-found: error

  release:
    needs: [version, server-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROIDDECK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROIDDECK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROIDDECK_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
          fi

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROIDDECK_KEYSTORE_PASSWORD: ${{ secrets.ANDROIDDECK_KEYSTORE_PASSWORD }}
          ANDROIDDECK_KEY_ALIAS: ${{ secrets.ANDROIDDECK_KEY_ALIAS }}
          ANDROIDDECK_KEY_PASSWORD: ${{ secrets.ANDROIDDECK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE" --stacktrace

      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: dist
          merge-multiple: true

      - name: Package
        run: |
          mkdir -p dist staging
          cp android/app/build/outputs/apk/release/app-release.apk "dist/AndroidDeck-$VERSION.apk"

          rsync -a --exclude '.venv' --exclude '__pycache__' --exclude '.ruff_cache' --exclude 'tests' \
            --exclude 'build' --exclude 'dist' server/ "staging/AndroidDeck-server-$VERSION/"
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" "staging/AndroidDeck-server-$VERSION/androiddeck/__init__.py"
          sed -i "s/^version = .*/version = \"$VERSION\"/" "staging/AndroidDeck-server-$VERSION/pyproject.toml"
          (cd staging && zip -qr "../dist/AndroidDeck-server-$VERSION-source.zip" "AndroidDeck-server-$VERSION")

          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: AndroidDeck ${{ env.VERSION }}
          draft: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
